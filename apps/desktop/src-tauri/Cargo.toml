[package]
name = "audioprocess-prototype"
version = "0.1.0"
description = "Tauri shell for the AudioProcess graph executor prototype"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio = { version = "1", features = ["time", "sync", "macros"] }
sha2 = "0.10.9"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_System_DataExchange", "Win32_System_Memory"] }
windows-core = "0.61.2"
